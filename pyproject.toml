[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rock-paper-scissors-game"
version = "0.1.0"
description = "A beginner-friendly Rock, Paper, Scissors game against the computer."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rock-paper-scissors = "rock_paper_scissors.game:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
